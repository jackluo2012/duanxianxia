apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-main
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse              # ✅ Corrected: server → host
      port: 8123
      protocol: http
      secure: false                 # ✅ Added: explicit non-secure connection
      username: default
      defaultDatabase: duanxianxia  # ✅ Corrected: database → defaultDatabase, use business database
      dialTimeout: 10               # ✅ Added: connection timeout
      queryTimeout: 120             # ✅ Added: query timeout (2 minutes for complex queries)
      validateSql: true             # ✅ Added: enable SQL validation
    secureJsonData:
      password: ""                  # ✅ Corrected: use secure storage for password
