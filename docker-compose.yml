version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: duanxianxia

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: duanxianxia_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  # 竞价分析模块服务 (Phase 2 Week 1)
  auction-service:
    build: ./services/auction-service
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - redis
    restart: unless-stopped

  auction-storage:
    build: ./services/auction-storage
    ports:
      - "8084:8084"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_URL=redis://redis:6379
      - BIND_ADDRESS=0.0.0.0:8084
      - RUST_LOG=info
    depends_on:
      - clickhouse
      - redis
    restart: unless-stopped

  auction-realtime:
    build: ./services/auction-realtime
    ports:
      - "8085:8085"
    environment:
      - REDIS_URL=redis://redis:6379
      - BIND_ADDRESS=0.0.0.0:8085
      - RUST_LOG=info
    depends_on:
      - redis
    restart: unless-stopped

  # Grafana可视化平台 (Phase 2 Week 2)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "127.0.0.1:3002:3000"  # 仅本机访问，改为3002避免与其他服务冲突
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-false}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/data:/var/lib/grafana
      - ./grafana/logs:/var/log/grafana
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 10 --tries=1 http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  clickhouse_data:
  redis_data:
  postgres_data:
