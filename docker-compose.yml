services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.11
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: duanxianxia
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: duanxianxia_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  # 竞价分析模块服务 (Phase 2 Week 1)
  auction-service:
    build: ./services/auction-service
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - redis
    restart: unless-stopped

  auction-storage:
    build: ./services/auction-storage
    ports:
      - "8084:8084"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_URL=redis://redis:6379
      - BIND_ADDRESS=0.0.0.0:8084
      - RUST_LOG=info
    depends_on:
      - clickhouse
      - redis
    restart: unless-stopped

  auction-realtime:
    build: ./services/auction-realtime
    ports:
      - "8085:8085"
    environment:
      - REDIS_URL=redis://redis:6379
      - BIND_ADDRESS=0.0.0.0:8085
      - RUST_LOG=info
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  clickhouse_data:
  redis_data:
  postgres_data:
