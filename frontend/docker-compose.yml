version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://api:8089
      - VITE_STORAGE_URL=http://storage:8083
      - VITE_REALTIME_URL=ws://realtime:8090
    networks:
      - duanxianxia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  duanxianxia-network:
    driver: bridge
