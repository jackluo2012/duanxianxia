[workspace]
resolver = "2"
members = [
    "shared",
    # TODO: 添加其他微服务
    "services/data-collector",
    "services/storage-service",
    "services/realtime-service",
    "services/query-service",
    "services/auth-service",
    # "services/gateway",
    "services/auction-service",
    "services/auction-storage",
    "services/auction-realtime",
    "services/kline-collector",
]

[workspace.dependencies]
# 通用依赖版本统一管理（2025年最新版本）
actix-web = "4.9"
actix-ws = "0.3"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rustdx-complete = "0.6.4"
