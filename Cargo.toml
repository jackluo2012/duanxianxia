[workspace]
resolver = "2"
members = [
    "shared/common",
    "shared/trading-calendar",
    "crates/domain",
    # TODO: 添加其他微服务
    "services/data-collector",
    "services/storage-service",
    "services/realtime-service",
    "services/query-service",
    "services/auth-service",
    "services/gateway-service",
    "services/auction-service",
    "services/auction-storage",
    "services/auction-realtime",
    "services/kline-collector",
    "services/backtest-service",
    "services/limit-review-service",
]

[workspace.dependencies]
# 通用依赖版本统一管理（2025年最新版本）
actix-web = "4.9"
actix-ws = "0.3"
actix-http = "3.0"
actix-rt = "2.10"
awc = "3.0"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
chrono-tz = "0.10"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "chrono", "time"] }
async-trait = "0.1"
rustdx-complete = "1.0.0"
