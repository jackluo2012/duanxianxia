[package]
name = "duanxianxia-service-discovery"
version = "0.1.0"
edition = "2021"
description = "服务发现与注册中心 - 基于Consul的服务治理"
authors = ["短线侠团队"]

[dependencies]
# Consul客户端
consul = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP客户端
reqwest = { version = "0.11", features = ["json"] }

# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = "1.0"

# 工具库
url = "2.5"
uuid = { version = "1.6", features = ["v4"] }
once_cell = "1.19"
dashmap = "5.5"

# 日志
tracing = { workspace = true }

# 重试机制
backoff = { version = "0.4", features = ["tokio"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
