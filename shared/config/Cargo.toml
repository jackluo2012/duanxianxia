[package]
name = "duanxianxia-config"
version = "0.1.0"
edition = "2021"
description = "配置中心客户端 - 支持Apollo/Nacos配置管理"
authors = ["短线侠团队"]

[dependencies]
# HTTP客户端
reqwest = { version = "0.11", features = ["json"] }

# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# 错误处理
anyhow = { workspace = true }
thiserror = "1.0"

# 工具库
url = "2.5"
once_cell = "1.19"
dashmap = "5.5"

# 配置热更新
notify = "6.1"

# 日志
tracing = { workspace = true }

# 加密（用于配置加密）
aes-gcm = "0.10"
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.9"
