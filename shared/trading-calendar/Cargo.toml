[package]
name = "trading-calendar"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
common = { path = "../common" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
