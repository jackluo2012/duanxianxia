version: '3.8'

services:
  # ClickHouse 数据库
  clickhouse:
    image: clickhouse/clickhouse-server:24.11
    container_name: duanxianxia-clickhouse-1
    ports:
      - "8123:8123"  # HTTP接口
      - "9000:9000"  # Native接口
    environment:
      CLICKHOUSE_DB: duanxianxia
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backtest-network

  # Backtest Service
  backtest-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backtest-service
    ports:
      - "8086:8086"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      RUST_LOG: info,backtest_service=debug
      RUST_BACKTRACE: 1
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backtest-network
    restart: unless-stopped

networks:
  backtest-network:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
