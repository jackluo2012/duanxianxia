[package]
name = "kline-collector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kline-collector"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustdx-complete = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager", "streams"] }
clickhouse = { version = "0.14.1", features = ["time"] }
actix-web = { workspace = true }
toml = "0.8"
dirs = "5.0"
shared = { path = "../../shared" }
prometheus = "0.13"
lazy_static = "1.4"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
