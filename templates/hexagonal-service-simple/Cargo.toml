[package]
name = "{{service_name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web框架
actix-web = "4.0"
actix-rt = "2.5"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# WebSocket
actix-ws = "0.1"
futures-util = "0.3"

# 配置
config = "0.14"
dotenv = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"
